<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">

  <!-- Background -->
  <rect width="512" height="512" rx="100" fill="white"/>

  <!-- Gradient for 3D feel -->
  <defs>
    <linearGradient id="sky3d" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- 3D Perspective S (top wider, bottom tighter, shifted up) -->
  <path d="
    M380 120
    C380 70, 300 50, 240 50
    C160 50, 120 100, 120 160
    C120 220, 170 250, 250 270
    C330 290, 380 310, 380 360
    C380 420, 310 460, 240 460
    C180 460, 130 430, 120 380
  "
  fill="none"
  stroke="url(#sky3d)"
  stroke-width="70"
  stroke-linecap="round"
  stroke-linejoin="round"/>

</svg>